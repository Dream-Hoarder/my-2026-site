<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream-Hoarder | 2026 Site</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
	<main>
    <h1>System: Online</h1>
    <p>Human Developer: <strong>Dream-Hoarder</strong></p>
    
    <div id="status-card">
        <p>AI Assistance: Active</p>
        <p id="js-test">JavaScript: Operational</p>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Weather (London)</h3>
            <p id="weather-temp">--°C</p>
            <p id="weather-desc">Syncing...</p>
        </div>

        <div class="card">
            <h3>Stock (Apple)</h3>
            <p id="stock-symbol">AAPL</p>
            <p id="stock-price">Loading...</p>
        </div>

        <div class="card">
            <h3>AI Thought</h3>
            <p id="ai-response" style="font-style: italic;">"Thinking..."</p>
            <button onclick="askAI()">New Thought</button>
        </div>
    </div>
    <section id="contact">
        </section>
</main>
    <script src="js/app.js"></script>
</body>
</html>
