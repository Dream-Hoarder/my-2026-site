<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream-Hoarder | 2026 Site</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <main>
        <h1>System: Online</h1>
        <p>Human Developer: <strong>Dream-Hoarder</strong></p>
        
        <div id="status-card">
            <p>AI Assistance: Active</p>
            <p id="js-test">JavaScript: Operational</p>
        </div>

        <div class="dashboard">
            <div class="card">
                <div class="status-indicator" id="weather-status"></div>
                <h3>Weather (London)</h3>
                <p id="weather-temp">--°C</p>
                <p id="weather-desc">Syncing...</p>
            </div>

            <div class="card">
                <div class="status-indicator" id="stock-status"></div>
                <h3>Stock (Apple)</h3>
                <p id="stock-symbol">AAPL</p>
                <p id="stock-price">Loading...</p>
            </div>

            <div class="card">
                <div class="status-indicator" id="ai-status"></div>
                <h3>AI Thought</h3>
                <p id="ai-response" style="font-style: italic;">"Thinking..."</p>
                <button onclick="askAI()">New Thought</button>
            </div>
        </div>

        <section id="terminal-container">
            <div class="terminal-header">
                <span><i class="fas fa-terminal"></i> System Logs</span>
                <div class="dots"><span></span><span></span><span></span></div>
            </div>
            <div id="terminal-body">
                </div>
        </section>

        <section id="contact">
            <h2>Connect</h2>
            <div class="contact-links">
                <a href="mailto:willie.bonnerjr@outlook.com" class="btn">Email Me</a>
                <a href="https://github.com/Dream-Hoarder" class="btn">GitHub</a>
            </div>
        </section>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
